name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/three/build/three.min.js www/three.min.js
      - name: Add Android and icons
        run: |
          npx cap add android
          sed -i 's/<activity /<activity android:screenOrientation="landscape" /' android/app/src/main/AndroidManifest.xml
          R=android/app/src/main/res
          sed -i 's#<item name="windowActionBar">false</item>#<item name="windowActionBar">false</item><item name="android:windowFullscreen">true</item>#' $R/values/styles.xml
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-$d.png $R/mipmap-$d/ic_launcher.png
            cp icon-$d.png $R/mipmap-$d/ic_launcher_round.png
            cp icon-$d.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jack-stirner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
